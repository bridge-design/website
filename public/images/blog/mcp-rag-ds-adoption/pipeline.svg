<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 185" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="Pipeline: git history flows through filter and embedding into Postgres with pgvector, then served to the agent via an MCP server. Ingestion runs once at setup; retrieval runs on every query.">
  <defs>
    <marker id="pipe-arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#8b8174"/>
    </marker>
  </defs>

  <!-- Ingestion bracket (neutral) -->
  <text x="339" y="22" text-anchor="middle" fill="#8b8174" font-size="10" font-weight="700" letter-spacing="1.2">INGESTION</text>
  <text x="339" y="34" text-anchor="middle" fill="#a39788" font-size="9" font-style="italic">runs once at setup, then incrementally</text>
  <line x1="73" y1="46" x2="605" y2="46" stroke="#8b8174" stroke-width="1.5"/>
  <line x1="73" y1="46" x2="73" y2="58" stroke="#8b8174" stroke-width="1.5"/>
  <line x1="605" y1="46" x2="605" y2="58" stroke="#8b8174" stroke-width="1.5"/>

  <!-- Retrieval bracket (teal) -->
  <text x="684" y="22" text-anchor="middle" fill="#01949a" font-size="10" font-weight="700" letter-spacing="1.2">RETRIEVAL</text>
  <text x="684" y="34" text-anchor="middle" fill="#01949a" font-size="9" font-style="italic" opacity="0.8">runs on every query</text>
  <line x1="487" y1="46" x2="881" y2="46" stroke="#01949a" stroke-width="1.5"/>
  <line x1="487" y1="46" x2="487" y2="58" stroke="#01949a" stroke-width="1.5"/>
  <line x1="881" y1="46" x2="881" y2="58" stroke="#01949a" stroke-width="1.5"/>

  <!-- Shared-box bridge indicator -->
  <polygon points="546,58 552,64 546,70 540,64" fill="none" stroke="#01949a" stroke-width="1" opacity="0.5"/>

  <!-- Box 0: Git history -->
  <g>
    <rect x="73" y="90" width="118" height="76" rx="5" fill="#f0eadb" stroke="#e5ddc8" stroke-width="1.2"/>
    <text x="132" y="120" text-anchor="middle" fill="#1a1814" font-size="11" font-weight="700">Git history</text>
    <text x="132" y="144" text-anchor="middle" fill="#746b60" font-size="9">team’s full repo log</text>
  </g>

  <!-- Box 1: Filter -->
  <g>
    <rect x="211" y="90" width="118" height="76" rx="5" fill="#f0eadb" stroke="#e5ddc8" stroke-width="1.2"/>
    <text x="270" y="120" text-anchor="middle" fill="#1a1814" font-size="11" font-weight="700">Filter</text>
    <text x="270" y="144" text-anchor="middle" fill="#746b60" font-size="9">adoption commits only</text>
  </g>

  <!-- Box 2: Embedding API -->
  <g>
    <rect x="349" y="90" width="118" height="76" rx="5" fill="#f0eadb" stroke="#e5ddc8" stroke-width="1.2"/>
    <text x="408" y="120" text-anchor="middle" fill="#1a1814" font-size="11" font-weight="700">Embedding API</text>
    <text x="408" y="144" text-anchor="middle" fill="#746b60" font-size="9">text → vector</text>
  </g>

  <!-- Box 3: Postgres + pgvector (shared between ingestion and retrieval) -->
  <g>
    <rect x="487" y="90" width="118" height="76" rx="5" fill="#f0eadb" stroke="#01949a" stroke-width="1.8"/>
    <text x="546" y="114" text-anchor="middle" fill="#1a1814" font-size="11" font-weight="700">Postgres</text>
    <text x="546" y="127" text-anchor="middle" fill="#1a1814" font-size="11" font-weight="700">+ pgvector</text>
    <text x="546" y="144" text-anchor="middle" fill="#746b60" font-size="9">stored locally</text>
  </g>

  <!-- Box 4: MCP server -->
  <g>
    <rect x="625" y="90" width="118" height="76" rx="5" fill="#f0eadb" stroke="#e5ddc8" stroke-width="1.2"/>
    <text x="684" y="120" text-anchor="middle" fill="#1a1814" font-size="11" font-weight="700">MCP server</text>
    <text x="684" y="144" text-anchor="middle" fill="#746b60" font-size="9">Node process, local</text>
  </g>

  <!-- Box 5: Agent -->
  <g>
    <rect x="763" y="90" width="118" height="76" rx="5" fill="#f0eadb" stroke="#e5ddc8" stroke-width="1.2"/>
    <text x="822" y="120" text-anchor="middle" fill="#1a1814" font-size="11" font-weight="700">Agent</text>
    <text x="822" y="144" text-anchor="middle" fill="#746b60" font-size="9">Claude Code or other</text>
  </g>

  <!-- Arrows between boxes -->
  <line x1="193" y1="128" x2="209" y2="128" stroke="#8b8174" stroke-width="1.5" marker-end="url(#pipe-arr)"/>
  <line x1="331" y1="128" x2="347" y2="128" stroke="#8b8174" stroke-width="1.5" marker-end="url(#pipe-arr)"/>
  <line x1="469" y1="128" x2="485" y2="128" stroke="#8b8174" stroke-width="1.5" marker-end="url(#pipe-arr)"/>
  <line x1="607" y1="128" x2="623" y2="128" stroke="#8b8174" stroke-width="1.5" marker-end="url(#pipe-arr)"/>
  <line x1="745" y1="128" x2="761" y2="128" stroke="#8b8174" stroke-width="1.5" marker-end="url(#pipe-arr)"/>
</svg>
