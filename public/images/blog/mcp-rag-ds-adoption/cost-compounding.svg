<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="Cost per task over 50 tasks. Naive AI on legacy stays flat near 20 dollars per task. With RAG starts around 5 dollars and falls toward 1 dollar as the corpus grows. Numbers are illustrative.">
  <style>
    /* light defaults — bridge-the-gap design tokens */
    .chart-grid { stroke: #e5ddc8; }
    .chart-axis { stroke: #8b8174; }
    .chart-tick-text { fill: #8b8174; }
    .chart-axis-label { fill: #746b60; }
    .chart-naive-line { stroke: #746b60; }
    .chart-rag-line { stroke: #01949a; }
    .chart-naive-text { fill: #746b60; }
    .chart-rag-text { fill: #01949a; }
    .chart-legend-bg { fill: #f0eadb; }

    /* dark overrides — activates when OS prefers dark */
    @media (prefers-color-scheme: dark) {
      .chart-grid { stroke: #46413a; }
      .chart-axis { stroke: #a39788; }
      .chart-tick-text { fill: #a39788; }
      .chart-axis-label { fill: #a39788; }
      .chart-naive-line { stroke: #a39788; }
      .chart-rag-line { stroke: #00b4ba; }
      .chart-naive-text { fill: #a39788; }
      .chart-rag-text { fill: #00b4ba; }
      .chart-legend-bg { fill: #302c27; }
    }
  </style>

  <!-- Vertical gridlines (task = 10, 20, 30, 40) -->
  <line x1="202" y1="50" x2="202" y2="360" stroke-width="1" stroke-dasharray="3 3" class="chart-grid"/>
  <line x1="326.5" y1="50" x2="326.5" y2="360" stroke-width="1" stroke-dasharray="3 3" class="chart-grid"/>
  <line x1="450.9" y1="50" x2="450.9" y2="360" stroke-width="1" stroke-dasharray="3 3" class="chart-grid"/>
  <line x1="575.4" y1="50" x2="575.4" y2="360" stroke-width="1" stroke-dasharray="3 3" class="chart-grid"/>

  <!-- Horizontal gridlines (cost = 5, 10, 15, 20) -->
  <line x1="90" y1="289.5" x2="700" y2="289.5" stroke-width="1" stroke-dasharray="3 3" class="chart-grid"/>
  <line x1="90" y1="219.1" x2="700" y2="219.1" stroke-width="1" stroke-dasharray="3 3" class="chart-grid"/>
  <line x1="90" y1="148.6" x2="700" y2="148.6" stroke-width="1" stroke-dasharray="3 3" class="chart-grid"/>
  <line x1="90" y1="78.2" x2="700" y2="78.2" stroke-width="1" stroke-dasharray="3 3" class="chart-grid"/>

  <!-- Axes -->
  <line x1="90" y1="50" x2="90" y2="360" stroke-width="1.5" opacity="0.4" class="chart-axis"/>
  <line x1="90" y1="360" x2="700" y2="360" stroke-width="1.5" opacity="0.4" class="chart-axis"/>

  <!-- X-axis ticks and labels -->
  <g>
    <line x1="90" y1="360" x2="90" y2="365" stroke-width="1" opacity="0.4" class="chart-axis"/>
    <text x="90" y="378" text-anchor="middle" font-size="10" class="chart-tick-text">1</text>
  </g>
  <g>
    <line x1="202" y1="360" x2="202" y2="365" stroke-width="1" opacity="0.4" class="chart-axis"/>
    <text x="202" y="378" text-anchor="middle" font-size="10" class="chart-tick-text">10</text>
  </g>
  <g>
    <line x1="326.5" y1="360" x2="326.5" y2="365" stroke-width="1" opacity="0.4" class="chart-axis"/>
    <text x="326.5" y="378" text-anchor="middle" font-size="10" class="chart-tick-text">20</text>
  </g>
  <g>
    <line x1="450.9" y1="360" x2="450.9" y2="365" stroke-width="1" opacity="0.4" class="chart-axis"/>
    <text x="450.9" y="378" text-anchor="middle" font-size="10" class="chart-tick-text">30</text>
  </g>
  <g>
    <line x1="575.4" y1="360" x2="575.4" y2="365" stroke-width="1" opacity="0.4" class="chart-axis"/>
    <text x="575.4" y="378" text-anchor="middle" font-size="10" class="chart-tick-text">40</text>
  </g>
  <g>
    <line x1="700" y1="360" x2="700" y2="365" stroke-width="1" opacity="0.4" class="chart-axis"/>
    <text x="700" y="378" text-anchor="middle" font-size="10" class="chart-tick-text">50</text>
  </g>

  <!-- X-axis title -->
  <text x="395" y="396" text-anchor="middle" font-size="11" font-weight="600" class="chart-axis-label">tasks completed</text>

  <!-- Y-axis title (rotated) -->
  <text x="28" y="205" text-anchor="middle" font-size="11" font-weight="600" transform="rotate(-90, 28, 205)" class="chart-axis-label">$ per task</text>

  <!-- Naive AI line (flat at $20) -->
  <line x1="90" y1="78.2" x2="700" y2="78.2" stroke-width="2.5" opacity="0.75" class="chart-naive-line"/>

  <!-- With RAG curve -->
  <path d="M 90 289.5 C 301.6 289.5, 550.5 345.9, 700 345.9" fill="none" stroke-width="2.5" class="chart-rag-line"/>

  <!-- Naive legend -->
  <rect x="415" y="54.2" width="192" height="22" rx="3" opacity="0.9" class="chart-legend-bg"/>
  <line x1="420" y1="65.2" x2="440" y2="65.2" stroke-width="2.5" opacity="0.75" class="chart-naive-line"/>
  <text x="447" y="71.2" font-size="10" font-weight="700" class="chart-naive-text">Naive AI on legacy</text>

  <!-- RAG legend -->
  <rect x="107" y="257.5" width="108" height="22" rx="3" opacity="0.9" class="chart-legend-bg"/>
  <line x1="112" y1="268.5" x2="132" y2="268.5" stroke-width="2.5" class="chart-rag-line"/>
  <text x="139" y="274.5" font-size="10" font-weight="700" class="chart-rag-text">With RAG</text>
</svg>
